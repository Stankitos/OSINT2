name: OSINT Data Collector Automation

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

jobs:
  run-osint-collection:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the results back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OSINT Backend Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
        run: python osint_backend.py

      - name: Commit and Push Generated Report
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relatorio_osint.json
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: Update OSINT static report data [skip ci]"
            git push
          fi
